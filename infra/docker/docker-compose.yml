services:
  calibre:
    build:
      context: .
      dockerfile: calibre.Dockerfile
    volumes:
      - cache:/app/cache
      - tmp:/app/tmp
    network_mode: host

  app:
    build: .
    network_mode: host
    environment:
      DATABASE_URL: postgres://fichub:fichub@localhost:5432/fichub
      REDIS_URL: redis://localhost:6379
      CACHE_DIR: /app/cache
      TMP_DIR: /app/tmp
      CALIBRE_CONTAINER: calibre
      PORT: 8004
      RUST_LOG: info,fichub=debug
    volumes:
      - cache:/app/cache
      - tmp:/app/tmp
    depends_on:
      - calibre

volumes:
  cache:
  tmp:
