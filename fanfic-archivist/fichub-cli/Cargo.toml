[package]
name = "fichub-cli"
version = "0.1.0"
edition = "2024"
description = "CLI for the FicHub fanfiction archive — search, download, rate, kudos"
license = "AGPL-3.0-or-later"
repository = "https://opencommit.eu/MagicZhang/fichub"

[dependencies]
fanfic-archivist = { path = ".." }
tokio = { version = "1", features = ["full"] }
serde_json = "1"
clap = { version = "4", features = ["derive"] }
urlencoding = "2"

[[bin]]
name = "fichub"
path = "src/main.rs"
