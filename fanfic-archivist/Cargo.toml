[package]
name = "fanfic-archivist"
version = "0.1.0"
edition = "2024"
description = "Discord companion bot for FicHub: recommendations, search, downloads, requests, roadmap — Socrates-style companion to the self-hosted fanfiction archive"
license = "AGPL-3.0-or-later"
repository = "https://opencommit.eu/MagicZhang/fichub"
keywords = ["discord", "bot", "fanfiction", "fic", "recommendations", "archive", "poise", "serenity"]
categories = ["command-line-utilities", "web-programming::http-client", "network-programming"]

[lib]
name = "fanfic_archivist"
path = "src/lib.rs"

[[bin]]
name = "fanfic-archivist"
path = "src/main.rs"

[dependencies]
# Discord
poise = "0.6"
serenity = "0.12"

# Async runtime
tokio = { version = "1", features = ["full"] }

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }

# Redis (shared with FicHub for pagination cache)
redis = { version = "0.27", features = ["aio", "tokio-comp", "connection-manager"] }

# URL encoding for query strings
urlencoding = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"

# Config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "2"

# Date/time
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }

# URL parsing (for auto-URL detection)
url = "2"

# Async traits
async-trait = "0.1"

# UUIDs (Redis session keys)
uuid = { version = "1", features = ["v4"] }

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
