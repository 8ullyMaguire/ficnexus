[package]
name = "fichub"
version = "0.1.0"
edition = "2024"
description = "Fanfiction exporter: give it a story URL, get an EPUB/HTML/MOBI/PDF/AZW3/TXT/Markdown file"
# The web server (src/main.rs) is the binary `cargo run` should pick when no
# --bin is given. `migrate` is the one remaining one-shot CLI tool.
default-run = "fichub"

[workspace]
members = ["crates/scrapers"]
resolver = "2"

[dependencies]
# Web framework & runtime
axum = { version = "0.8", features = ["multipart", "ws"] }
time = "0.3"
tokio = { version = "1", features = ["full"] }
tokio-stream = { version = "0.1", features = ["sync"] }
futures = "0.3"
async-stream = "0.3"
tower = "0.5"
tower-http = { version = "0.7", features = ["cors", "compression-gzip", "trace", "fs"] }

# Database
sqlx = { version = "0.9", default-features = false, features = ["runtime-tokio", "postgres", "chrono", "uuid", "migrate", "tls-rustls-ring", "derive", "macros"] }

# Redis
redis = { version = "1.4", features = ["aio", "tokio-comp"] }
maxminddb = "0.30"

# HTTP client
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }

# HTML parsing
scraper = "0.27"

# Fanfiction scraping library (general-purpose, AGPL-3.0)
fanfic-scrapers = { path = "crates/scrapers" }

# EPUB generation
epub-builder = "0.8"

# Template engine
tera = "2"

# Serialization
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_urlencoded = "0.7"

# Config
dotenvy = "0.15"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["json", "env-filter"] }

# Metrics
axum-prometheus = "0.10"

# UUIDs
uuid = { version = "1", features = ["v4", "serde"] }

# HTTP types
http = "1"

# Hashing
md-5 = "0.11"
sha2 = "0.11"
hmac = "0.13"
subtle = "2"

# Date/time
chrono = { version = "0.4", default-features = false, features = ["serde", "std"] }

# Compression (zip)
zip = { version = "8", package = "zip" }

# Async traits
async-trait = "0.1"

# Error ergonomics (already in the dependency graph via axum internals)
thiserror = "2"

# Path handling
sanitize-filename = "0.5"

# Hashing/encoding
hex = "0.4"
regex-lite = "0.1"
rand = "0.8"
ipnetwork = "0.20"
urlencoding = "2"

base64 = "0.22"
anyhow = "1"
url = "2"

quick-xml = "0.41.0"
docx-rs = "0.4"

[dev-dependencies]
# Testing
axum-test = "16"

# Integration tests unzip an exported archive with the same crate the server
# uses (already in [dependencies]; this just makes it linkable from tests/
# without touching the lockfile).
zip = { version = "8", package = "zip" }
