[package]
name = "fanfic-scrapers"
version = "0.10.0"
edition = "2024"
description = "General-purpose fanfiction scraping library: pluggable site adapters (AO3, FFN, RoyalRoad, XenForo, ...) with a shared metadata model, FanFicFare integration, and optional LLM-assisted author-link extraction."
license = "AGPL-3.0-or-later"
repository = "https://opencommit.eu/MagicZhang/fanfic-scrapers"
readme = "README.md"
keywords = ["fanfiction", "scraper", "ao3", "fanficfare", "archive"]
categories = ["web-programming"]

[features]
# FanFicFare Python-CLI fallback (off by default — the crate has native
# parity for all real FFF sites; enable only if you want the long-tail
# fallback and have the `fanficfare` CLI installed).
fff-fallback = []

[dependencies]
async-trait = "0.1"
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls", "cookies"] }
primp = { version = "1.3", default-features = true }
tokio = { version = "1", features = ["time", "sync"] }
scraper = "0.27"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
chrono = { version = "0.4", default-features = false, features = ["serde", "std", "clock"] }
tracing = "0.1"
urlencoding = "2"
regex-lite = "0.1"

[dev-dependencies]
tokio = { version = "1", features = ["full"] }
